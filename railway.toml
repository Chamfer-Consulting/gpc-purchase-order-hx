# Railway service config for the PO Dashboard API.
# Build context is the repo root (the Dockerfile copies the reused modules from
# there); dockerfilePath points into backend/.
#
# In the Railway project: one service, this repo, root directory left at "/".
# Set env vars in the service's Variables tab (see docs/REBUILD-SETUP.md §4).
# Railway keeps the service running (no scale-to-zero on the paid tier).

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
healthcheckTimeout = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
