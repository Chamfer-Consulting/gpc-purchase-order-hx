name: Extract POs from Gmail

# "Automatic" = the schedule trigger below (incremental — only messages since the
# last successful run, via gmail_connection's stored cursor). "Manual" = the
# workflow_dispatch trigger, from this tab's "Run workflow" button or
# `gh workflow run extract_pos.yml [-f full_backlog=true] [-f limit=10]` — check
# the "Full backlog scan" box (or pass -f full_backlog=true) to ignore the cursor
# and scan every configured label's entire history instead, e.g. when onboarding a
# newly added customer label. Set "Limit" to cap how many threads get processed
# this run — e.g. a small real test before trusting a full (paid) run. See
# run_cloud_extraction.py / GMAIL_SETUP.md.

on:
  schedule:
    - cron: "0 12 * * *"  # ~7am US Central daily — edit this line to change cadence
  workflow_dispatch:
    inputs:
      full_backlog:
        description: "Full backlog scan (ignore the incremental cursor)"
        type: boolean
        default: false
      limit:
        description: "Limit (max threads to process this run — leave blank for no limit)"
        type: string
        default: ""

# Never let two runs overlap: a slow scheduled run + a manual dispatch (or the next
# day's schedule) would both read the same Gmail cursor, re-process overlapping
# threads, and pay Claude twice for them. Queue the second run rather than killing
# the first mid-flight (which could strand a thread / leave partial state).
concurrency:
  group: extract-pos
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run extraction
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_LABELS: ${{ secrets.GMAIL_LABELS }}
        run: |
          args=""
          if [ "${{ github.event.inputs.full_backlog }}" = "true" ]; then
            args="$args --full-backlog"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            args="$args --limit ${{ github.event.inputs.limit }}"
          fi
          python run_cloud_extraction.py $args

      # Exit code 3 (extract_pos.py's/run_cloud_extraction.py's "paused: out of API
      # credits" convention) surfaces as a normal job failure like any other
      # non-zero exit — intentional, so it's visible instead of silently stalling.
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-cloud-extraction-log
          path: run_cloud_extraction.log
