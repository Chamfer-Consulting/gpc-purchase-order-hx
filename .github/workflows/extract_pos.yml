name: Extract POs from Gmail

# "Automatic" = the schedule trigger below (incremental — only messages since the
# last successful run, via gmail_connection's stored cursor). "Manual" = the
# workflow_dispatch trigger, from this tab's "Run workflow" button or
# `gh workflow run extract_pos.yml [-f full_backlog=true] [-f limit=10]` — check
# the "Full backlog scan" box (or pass -f full_backlog=true) to ignore the cursor
# and scan every configured label's entire history instead, e.g. when onboarding a
# newly added customer label. Set "Limit" to cap how many threads get processed
# this run — e.g. a small real test before trusting a full (paid) run. See
# run_cloud_extraction.py / GMAIL_SETUP.md.

on:
  schedule:
    - cron: "0 12 * * *"  # ~7am US Central daily — edit this line to change cadence
  workflow_dispatch:
    inputs:
      full_backlog:
        description: "Full backlog scan (ignore the incremental cursor)"
        type: boolean
        default: false
      limit:
        description: "Limit (max threads to process this run — leave blank for no limit)"
        type: string
        default: ""

# This job only reads the repo and talks to external APIs (Gmail, Anthropic,
# Postgres) via secrets — it never pushes, opens PRs, or cuts releases, so drop
# the default GITHUB_TOKEN down to read-only.
permissions:
  contents: read

# Never let two runs overlap: a slow scheduled run + a manual dispatch (or the next
# day's schedule) would both read the same Gmail cursor, re-process overlapping
# threads, and pay Claude twice for them. Queue the second run rather than killing
# the first mid-flight (which could strand a thread / leave partial state).
#
# Consequence: while a long manual --full-backlog run holds the group (up to
# timeout-minutes below), the daily scheduled runs queue behind it and GitHub keeps
# only the newest queued one. That's fine — the next incremental run just covers a
# wider time window off the same cursor; nothing is missed.
concurrency:
  group: extract-pos
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    # The daily incremental run finishes in minutes; this headroom is for a manual
    # --full-backlog (thousands of threads, hours). run_cloud_extraction.py
    # checkpoints its results every CHECKPOINT_EVERY threads and installs a SIGTERM
    # handler, so even a run that hits this limit flushes what it has and the next
    # run resumes. GitHub's hard cap for a hosted-runner job is 360 minutes.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run extraction
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_LABELS: ${{ secrets.GMAIL_LABELS }}
          # Inputs come in via env (not inline ${{ }} in run:) so a free-text value
          # can't break out of the shell command. Both are empty on a scheduled run.
          FULL_BACKLOG: ${{ github.event.inputs.full_backlog }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          args=""
          if [ "$FULL_BACKLOG" = "true" ]; then
            args="$args --full-backlog"
          fi
          if [ -n "$LIMIT" ]; then
            args="$args --limit $LIMIT"
          fi
          python run_cloud_extraction.py $args

      # Exit code 3 (extract_pos.py's/run_cloud_extraction.py's "paused: out of API
      # credits" convention) surfaces as a normal job failure like any other
      # non-zero exit — intentional, so it's visible instead of silently stalling.
      # cancelled() is included so a manual cancel or a concurrency-supersede (which
      # are NOT failure()) still leave the log behind for diagnosis.
      - name: Upload log
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: run-cloud-extraction-log
          path: run_cloud_extraction.log
          retention-days: 30
          if-no-files-found: warn

      # A timed-out / cancelled / out-of-credits run is otherwise silent unless
      # someone happens to watch the Actions tab. Drop a line on the run's summary
      # page (no external secret needed) pointing at the log artifact above.
      - name: Flag failed run on the job summary
        if: failure() || cancelled()
        run: |
          {
            echo "### ⚠️ Extraction run did not finish cleanly"
            echo ""
            echo "Status: **${{ job.status }}**"
            echo ""
            echo "Download the \`run-cloud-extraction-log\` artifact from this run for details."
            echo "Re-running the same command is safe — already-processed threads are skipped."
          } >> "$GITHUB_STEP_SUMMARY"
