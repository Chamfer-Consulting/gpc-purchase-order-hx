name: Rebuild CI

# Guards the po-dashboard-rebuild work: backend tests + frontend typecheck/build.
# Runs on that branch and on any PR that touches backend/ or web/.

on:
  push:
    branches: [po-dashboard-rebuild]
    paths: ["backend/**", "web/**", ".github/workflows/rebuild_ci.yml"]
  pull_request:
    paths: ["backend/**", "web/**", ".github/workflows/rebuild_ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest
      - name: pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql://localhost/ci
          SUPABASE_JWT_SECRET: ci-secret
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: build
        working-directory: web
        env:
          VITE_SUPABASE_URL: https://ci.supabase.co
          VITE_SUPABASE_ANON_KEY: ci
          VITE_API_BASE: https://ci.example
        run: npm run build
