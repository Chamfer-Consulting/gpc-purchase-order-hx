name: Extractor regression eval

# Scores the current prompt + model + few-shot block against every human-reviewed
# target (extraction_reviews rows with a content snapshot) and fails if is_po or
# field accuracy drops below eval_baseline.json minus the script's tolerance.
# Runs only when something that can change extraction behaviour is touched.

on:
  push:
    branches: [main]
    paths:
      - extract_pos.py
      - product_catalog.py
      - run_cloud_extraction.py
      - extraction_reviews.py
      - eval_extraction.py
      - eval_baseline.json
  pull_request:
    paths:
      - extract_pos.py
      - product_catalog.py
      - run_cloud_extraction.py
      - extraction_reviews.py
      - eval_extraction.py
      - eval_baseline.json
  workflow_dispatch:
    inputs:
      limit:
        description: "Score only the first N cases (blank = all)"
        type: string
        default: ""

permissions:
  contents: read

# One eval at a time; a newer push supersedes a queued run.
concurrency:
  group: eval-extraction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          args=""
          if [ -n "$LIMIT" ]; then
            args="--limit $LIMIT"
          fi
          python eval_extraction.py --verbose $args
